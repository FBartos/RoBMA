name: pkgdown

on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: '4.6'}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache JAGS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Program Files\JAGS
          key: ${{ runner.os }}-jags-4.3.1
          restore-keys: |
            ${{ runner.os }}-jags-

      - name: Install JAGS (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\JAGS\JAGS-4.3.1\bin\jags-terminal.exe" (
            echo "JAGS not found in cache, downloading and installing..."
            curl -o jags-installer.exe -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe/download
            jags-installer.exe /S
            del jags-installer.exe
          ) else (
            echo "JAGS found in cache, skipping installation"
          )

      - name: Set JAGS environment variables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.1>> %GITHUB_ENV%
          echo JAGS_MAJOR_VERSION=4>> %GITHUB_ENV%
          echo C:\Program Files\JAGS\JAGS-4.3.1\bin>> %GITHUB_PATH%

      - name: Resolve BayesTools source
        id: bayestools
        run: Rscript .github/scripts/resolve-bayestools-source.R

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak_spec }}
            any::pkgdown
            any::posterior
            local::.

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
