name: pkgdown

# master and release tags publish the release site; development publishes the
# development site under /dev/.
on:
  push:
    branches: [master, development]
    tags: ['*']
  workflow_dispatch:

# Deployments push to gh-pages one at a time.
concurrency:
  group: pkgdown-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PKGDOWN_DEV_MODE: ${{ github.ref == 'refs/heads/development' && 'devel' || 'release' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: FBartos/BayesTools/.github/actions/setup-jags@development

      - name: Resolve BayesTools source
        id: bayestools
        uses: FBartos/BayesTools/.github/actions/bayestools-source@development

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak-spec }}
            any::pkgdown
            any::posterior
            local::.

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript .github/scripts/deploy-pkgdown.R
