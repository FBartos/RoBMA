name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install JAGS and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jags

      - name: Resolve BayesTools source
        id: bayestools
        run: Rscript .github/scripts/resolve-bayestools-source.R

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak_spec }}
            any::devtools
            any::pkgdown
            any::rcmdcheck
            any::posterior
            local::.

      - name: Verify JAGS installation
        run: |
          which jags || echo "JAGS not found in PATH"
          jags -version 2>/dev/null || echo "Could not get JAGS version"

      - name: Test JAGS R interface
        run: |
          cat('R version:', R.version.string, '\n')

          if (requireNamespace("rjags", quietly = TRUE)) {
            cat('rjags loaded successfully\n')
            tryCatch({
              model_string <- "
              model {
                x ~ dnorm(0, 1)
              }"
              model <- rjags::jags.model(textConnection(model_string), n.chains = 1, quiet = TRUE)
              cat('JAGS model creation successful\n')
            }, error = function(e) {
              cat('JAGS model creation failed:', e$message, '\n')
            })
          } else {
            cat('Failed to load rjags\n')
          }
        shell: Rscript {0}

      - name: Test RoBMA package functionality
        run: |
          cat('Testing basic RoBMA functionality...\n')
          tryCatch({
            data("Anderson2010", package = "RoBMA")
            cat('Example data loaded successfully\n')

            library(RoBMA)
            cat('RoBMA package loaded successfully\n')
          }, error = function(e) {
            cat('RoBMA basic test failed:', e$message, '\n')
          })
        shell: Rscript {0}

      - name: Run basic tests
        env:
          NOT_CRAN: "true"
        run: |
          devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
