name: R-unit-tests

# Runs the standard profile against cached standard fits. post-merge.yaml calls
# this workflow for Linux.
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of runner configurations, each {"os", "r"}.
        type: string
        required: true

# A called workflow sees the caller's github.workflow: the literal prefix keeps
# two workflows called by one caller apart, github.workflow keeps the callers
# (and a direct run) apart.
concurrency:
  group: R-unit-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    env:
      NOT_CRAN: "true"
      TESTTHAT_MAX_FAILS: Inf
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix || '[{"os":"windows-latest","r":"4.6"}]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up JAGS
        uses: FBartos/BayesTools/.github/actions/setup-jags@development

      - name: Resolve BayesTools source
        id: bayestools
        uses: FBartos/BayesTools/.github/actions/bayestools-source@development

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak-spec }}
            any::devtools
            any::posterior

      - name: Compute standard-fit cache key
        id: fit-cache-key
        shell: pwsh
        run: |
          $key = Rscript tools/test-cache-key.R standard
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore standard fitted models
        uses: actions/cache@v6
        with:
          path: tests/testthat/test_files/standard
          key: ${{ runner.os }}-r-${{ matrix.config.r }}-robma-${{ steps.fit-cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.config.r }}-robma-standard-

      - name: Refresh missing or stale fitted models
        run: |
          Rscript tools/test-profile.R refresh-standard

      - name: Run Unit Tests
        env:
          # The hosted Windows runner takes about 1.7 times as long as the
          # reference machine, where the standard budget is 1200 seconds.
          ROBMA_STANDARD_GATE_SECONDS: "2400"
        run: |
          Rscript tools/test-profile.R standard
