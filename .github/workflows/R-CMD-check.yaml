name: R-CMD-check

on:
  push:
    branches: [main, master, pre-release]
  pull_request:
    branches: [main, master, pre-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: '4.6'}
          - {os: ubuntu-latest, r: '4.6'}
          - {os: macos-15-intel, r: '4.6'}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache JAGS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Program Files\JAGS
          key: ${{ runner.os }}-jags-4.3.1
          restore-keys: |
            ${{ runner.os }}-jags-

      # Cache the JAGS 4.3.2 installer (macOS). RoBMA requires JAGS 4.x;
      # Homebrew's jags formula installs JAGS 5, so the official universal
      # package is used instead.
      - name: Cache JAGS installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/jags-installer
          key: ${{ runner.os }}-jags-pkg-4.3.2

      - name: Install JAGS and system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jags

      - name: Install JAGS (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\JAGS\JAGS-4.3.1\bin\jags-terminal.exe" (
            echo "JAGS not found in cache, downloading and installing..."
            curl -o jags-installer.exe -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe/download
            jags-installer.exe /S
            del jags-installer.exe
          ) else (
            echo "JAGS found in cache, skipping installation"
          )

      - name: Set JAGS environment variables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.1>> %GITHUB_ENV%
          echo JAGS_MAJOR_VERSION=4>> %GITHUB_ENV%
          echo C:\Program Files\JAGS\JAGS-4.3.1\bin>> %GITHUB_PATH%

      # Install JAGS 4.3.2 on macOS from the official universal package, which
      # installs into /usr/local (library, JAGS headers, jags.pc, jags binary)
      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          # Remove a Homebrew jags first: on Intel runners Homebrew also links
          # into /usr/local, where the package installs JAGS 4.3.2.
          if brew list --formula jags > /dev/null 2>&1; then
            brew uninstall --ignore-dependencies jags
          fi
          brew update
          brew install openblas automake
          command -v aclocal
          mkdir -p ~/jags-installer
          if [ ! -f ~/jags-installer/JAGS-4.3.2.pkg ]; then
            echo "JAGS installer not found in cache, downloading..."
            curl --retry 3 --fail -L -o ~/jags-installer/JAGS-4.3.2.pkg \
              https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.pkg/download
          fi
          sudo installer -pkg ~/jags-installer/JAGS-4.3.2.pkg -target /

      # Point pkg-config at the JAGS 4.3.2 installation; configure rejects any
      # JAGS major version other than 4 with a clear message
      - name: Set JAGS environment variables (macOS)
        if: runner.os == 'macOS'
        run: |
          OPENBLAS_PREFIX=$(brew --prefix openblas)
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:$OPENBLAS_PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> $GITHUB_ENV
          if command -v pkg-config > /dev/null 2>&1; then
            echo "pkg-config reports JAGS $(PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion jags)"
          fi

      - name: Verify JAGS runtime files (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v jags
          test -f /usr/local/lib/JAGS/modules-4/basemod.so
          test -f /usr/local/lib/JAGS/modules-4/bugs.so
          test -f "$(brew --prefix openblas)/lib/libopenblas.0.dylib"
          ls -l /usr/local/lib/libjags*.dylib
          ls -l /usr/local/lib/JAGS/modules-4/basemod.so

      - name: Resolve BayesTools source
        id: bayestools
        run: Rscript .github/scripts/resolve-bayestools-source.R

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak_spec }}
            any::rcmdcheck
            any::posterior

      - name: Verify rjags JAGS runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          library(rjags)
          rjags::load.module("bugs", quiet = TRUE)
          cat("rjags JAGS runtime OK\n")
        shell: Rscript {0}

      - name: Check
        if: runner.os == 'Linux'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args  = c("--no-build-vignettes"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Check
        if: runner.os == 'macOS'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran", "--ignore-vignettes",
                            "--install-args=--configure-args=--enable-rpath"),
            build_args  = c("--no-build-vignettes"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Check
        if: runner.os == 'Windows'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          JAGS_ROOT: "/c/progra~1/JAGS/JAGS-4.3.1"
          JAGS_MAJOR_VERSION: 4
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args  = c("--no-build-vignettes"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
