name: R-CMD-check

on:
  push:
    branches: [main, master, pre-release]
  pull_request:
    branches: [main, master, pre-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: '4.6'}
          - {os: ubuntu-latest, r: '4.6'}
          - {os: macos-15-intel, r: '4.6'}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache JAGS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Program Files\JAGS
          key: ${{ runner.os }}-jags-4.3.1
          restore-keys: |
            ${{ runner.os }}-jags-

      - name: Cache JAGS (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/Cellar/jags
            /usr/local/opt/jags
            /opt/homebrew/Cellar/jags
            /opt/homebrew/opt/jags
          key: ${{ runner.os }}-jags-${{ hashFiles('.github/workflows/R-CMD-check.yaml') }}
          restore-keys: |
            ${{ runner.os }}-jags-

      - name: Install JAGS and system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jags

      - name: Install JAGS (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\JAGS\JAGS-4.3.1\bin\jags-terminal.exe" (
            echo "JAGS not found in cache, downloading and installing..."
            curl -o jags-installer.exe -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe/download
            jags-installer.exe /S
            del jags-installer.exe
          ) else (
            echo "JAGS found in cache, skipping installation"
          )

      - name: Set JAGS environment variables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.1>> %GITHUB_ENV%
          echo JAGS_MAJOR_VERSION=4>> %GITHUB_ENV%
          echo C:\Program Files\JAGS\JAGS-4.3.1\bin>> %GITHUB_PATH%

      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! brew list jags >/dev/null 2>&1; then
            echo "JAGS not installed, installing via brew..."
            brew update
            brew install jags
          else
            echo "JAGS already installed, skipping installation"
          fi

      - name: Set JAGS environment variables (macOS)
        if: runner.os == 'macOS'
        run: |
          JAGS_BIN=$(brew --prefix jags)/bin
          echo "JAGS_ROOT=$(brew --prefix jags)" >> $GITHUB_ENV
          echo "PATH=$JAGS_BIN:$PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix jags)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Link JAGS runtime files (macOS)
        if: runner.os == 'macOS'
        run: |
          JAGS_PREFIX=$(brew --prefix jags)
          BREW_PREFIX=$(brew --prefix)
          brew link --overwrite jags
          sudo mkdir -p "$BREW_PREFIX/libexec"
          sudo ln -sf "$JAGS_PREFIX/bin/jags" "$BREW_PREFIX/libexec/jags-terminal"
          test -f "$BREW_PREFIX/lib/JAGS/modules-4/basemod.so"
          ls -l "$BREW_PREFIX"/lib/libjags*.dylib
          ls -l "$BREW_PREFIX"/lib/JAGS/modules-4/basemod.so

      - name: Install autoreconf dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v aclocal >/dev/null 2>&1; then
            brew install automake
          fi
          command -v aclocal

      - name: Resolve BayesTools source
        id: bayestools
        run: Rscript .github/scripts/resolve-bayestools-source.R

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak_spec }}
            any::rcmdcheck
            any::posterior

      - name: Check
        if: runner.os != 'Windows'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args  = c("--no-build-vignettes"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Check
        if: runner.os == 'Windows'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          JAGS_ROOT: "/c/progra~1/JAGS/JAGS-4.3.1"
          JAGS_MAJOR_VERSION: 4
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args        = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args  = c("--no-build-vignettes"),
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
