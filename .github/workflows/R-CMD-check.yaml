name: R-CMD-check

# Pushes and pull requests check the CI platforms without vignettes;
# weekly.yaml and release-check.yaml call this workflow for further R versions
# and platforms, the release check with vignettes.
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of runner configurations, each {"os", "r"}.
        type: string
        required: true
      ref:
        description: Git ref to check; empty checks the triggering ref.
        type: string
        default: ""
      vignettes:
        description: Build and check the vignettes.
        type: boolean
        default: false

# Called workflows share the caller's github.workflow, hence the literal prefix.
concurrency:
  group: R-CMD-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix || '[{"os":"windows-latest","r":"4.6"},{"os":"ubuntu-latest","r":"4.6"},{"os":"macos-latest","r":"4.6"}]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: FBartos/BayesTools/.github/actions/setup-jags@development
        with:
          automake: "true"

      - name: Resolve BayesTools source
        id: bayestools
        uses: FBartos/BayesTools/.github/actions/bayestools-source@development

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            ${{ steps.bayestools.outputs.pak-spec }}
            any::rcmdcheck
            any::posterior

      - name: Verify rjags JAGS runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          library(rjags)
          rjags::load.module("bugs", quiet = TRUE)
          cat("rjags JAGS runtime OK\n")
        shell: Rscript {0}

      - name: Check
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          CHECK_VIGNETTES: ${{ inputs.vignettes }}
        run: |
          options(crayon.enabled = TRUE)
          args       <- c("--no-manual", "--as-cran")
          build_args <- character()
          if (!identical(Sys.getenv("CHECK_VIGNETTES"), "true")) {
            args       <- c(args, "--ignore-vignettes")
            build_args <- "--no-build-vignettes"
          }
          if (identical(Sys.info()[["sysname"]], "Darwin")) {
            args <- c(args, "--install-args=--configure-args=--enable-rpath")
          }
          rcmdcheck::rcmdcheck(
            args        = args,
            build_args  = build_args,
            error_on    = "warning",
            check_dir   = "check")
        shell: Rscript {0}

      # A binary the maintainer can install to try a pull request.
      - name: Build Windows binary
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        run: |
          dir.create("binary")
          pkgbuild::build(binary = TRUE, dest_path = "binary")
        shell: Rscript {0}

      - name: Upload Windows binary
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: RoBMA-windows-binary
          path: binary/*.zip
          retention-days: 14

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-r${{ matrix.config.r }}-results
          path: check
