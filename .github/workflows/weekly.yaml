name: weekly

# Platforms and R versions outside the per-push checks. GitHub runs scheduled
# and manually dispatched workflows from the default branch; a scheduled run
# checks out development.
on:
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/R-CMD-check.yaml
    with:
      ref: ${{ github.event_name == 'schedule' && 'development' || '' }}
      matrix: >-
        [{"os": "windows-latest", "r": "devel"},
         {"os": "windows-latest", "r": "oldrel-1"},
         {"os": "macos-15-intel", "r": "4.6"}]

  tests:
    uses: ./.github/workflows/R-CMD-tests.yaml
    with:
      ref: ${{ github.event_name == 'schedule' && 'development' || '' }}
      matrix: '[{"os": "ubuntu-latest", "r": "4.6"}]'
